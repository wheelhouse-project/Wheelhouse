# ONNX Runtime settings for the Parakeet provider on the CPU path
# (wh-parakeet-spinning-upgrade). sherpa_engine.py passes this file to
# sherpa-onnx as provider="cpu:<absolute path of this file>". sherpa-onnx
# 1.13.5 and later give each "SessionConfig.<key>=<value>" line to ONNX
# Runtime AddConfigEntry. Format: key=value, one per line; '#' starts a
# comment.
#
# The worker threads sleep when they have no work, instead of waiting for
# work in a loop. With the loop, the provider kept 8 to 9 logical
# processors busy for the whole time a person spoke (measured 2026-10-17
# on a 20-processor machine, bead wh-dm8o.1). On the 835-utterance corpus
# this setting changed no transcript, and the mean decode time was 136.6 ms
# against 143.6 ms without it (one run each).
SessionConfig.session.intra_op.allow_spinning=0
