# Bare grid numbers 1-9 (word or digit, optional leading "number"). A number
# the grid consumes NEVER falls through to dictation. With the grid closed
# grid_number_command offers the number to the numbered overlay
# (wh-overlay-count-homophones.1.1): with badges showing it clicks badge N,
# and only with neither showing does the g1 text dictate verbatim, so
# "number five" still types as words when nothing is on screen.
#
# The two word-form patterns also list "too", "to" and "for"
# (wh-overlay-count-homophones, David's decision 2026-09-03): the speech
# engine returns those words for the spoken "two" and "four", so without
# them a spoken grid number matched no grid pattern at all. "too" precedes
# "to" only for readability; the regex engine backtracks either way. The
# digit pattern below needs nothing, because a digit is never a homophone.
# The accepted cost is David's: with the grid OPEN a bare "to", "too" or
# "for" refines a cell, and with badges showing it clicks badge 2 or 4,
# instead of typing. With neither on screen it still types.
[[pattern]]
