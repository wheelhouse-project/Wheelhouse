# =============================================================================
# REPLACEMENTS - Non-Speech Sounds
# =============================================================================
# Hums and hesitation noises that the shipped Parakeet engine transcribes as
# literal words. The empty text param consumes the match and types nothing.
#
# Boundaries are (?<![\w-]) / (?![\w-]) rather than \b because \b treats a
# hyphen as a boundary: \buh\b would match the "uh" inside "uh-huh" and type
# the leftover "-huh". Excluding a hyphen on both sides means only a whole
# token in the list is consumed.
#
# "mm" alone is NOT in the list: it is the written abbreviation for
# millimeter, and the engine emits it for the unit as well as for the hum.
#
# The list holds six sounds, which is the most the pattern explainer can
# render as spoken words (_MAX_VARIANTS). A seventh sound makes the
# explainer quote this raw expression at the user instead, and the pinned
# allowlist in tests/test_pattern_explainer.py fails. Raise that limit
# before you add another sound here.
[[pattern]]
pattern = '''(?<![\w-])(?:mm-hmm|mm-mm|mhm|hmm|uh|um)(?![\w-])'''
doc_id = "filter-filler-sounds"
actions = [
    { function = "text", params = [""] }
]

