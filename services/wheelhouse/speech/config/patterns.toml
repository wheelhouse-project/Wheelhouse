# Insert raw text at cursor without intelligent insertion.
# No prefix space, no capitalization, no TextPerfector, no letter buffering.
# Deliberately has no requires_hotword. Commit cd33da60 removed the hotword
# requirement because it blocked dictation use. The command is not disruptive
# -- it only puts the text that follows the word "insert" at the cursor -- and
# it is useful, so it stays available without the hotword. Do not add
# requires_hotword back without asking; the hotword-free behavior is the design.
# Examples: "insert hello world", "insert @example.com", "insert TODO:"
#
# wh-qoyk9: this pattern intentionally has no awaits_done. Logic emits
# end_utterance immediately after dispatching insert_raw, which then
# schedules a deferred clipboard restore via PendingRestore (wh-d0lr1)
# rather than relying on a synchronous restore inside the input process.
# Adding awaits_done here would block end_utterance on the IPC ack, which
# is unnecessary and would slow the next dictation. The deferred-restore
# mechanism is itself race-free and ownership-aware (Win32 clipboard
# sequence number check at fire time), so the previous slow-target race
# the no-awaits_done choice exposed is no longer a concern.
[[pattern]]
pattern = '''^insert\s*(.+)$'''
doc_id = "insert-raw"
actions = [
    { function = "insert_raw", params = ["g1"] }
]

# "submit" lives in the trailing-position section near the top of this
# file (wh-2vz). The previous leading-position entry was removed when
# the trailing entry was added; a leading + trailing pair would
# silently pre-empt the trailing intercept in single-word utterances.

# "dismiss" is the Voice Access word for the Escape key
# (wh-voice-access-parity.1.6). Widened rather than added as a second row:
# the catalog indexes a command by its LEADING PLAIN ALTERNATION, so both
# words reach this entry, and one row cannot fall out of order against
# itself. whole_utterance_only stays -- it is what keeps "dismiss the
# meeting invite" dictating instead of pressing Escape and typing the rest.
# It does not collide with "dismiss numbers" or "dismiss grid": those are
# anchored two-word patterns, and this one is anchored at both ends.
[[pattern]]
pattern = '''^(?:escape|dismiss)$'''
doc_id = "escape"
whole_utterance_only = true
actions = [
    { function = "press", params = ["esc"] }
]

# -----------------------------------------------------------------------
# BLOCK 2 -- bare "enter". New entry, no placement constraint. See the
# BARE ENTER / BARE TAB note above for the whole_utterance_only reasoning
# and the SUBMIT CAUTION note for why this does not endanger the trailing
# submit-enter entry.
# -----------------------------------------------------------------------
[[pattern]]
pattern = '''^enter$'''
doc_id = "enter"
whole_utterance_only = true
actions = [
    { function = "press", params = ["enter"] }
]

# -----------------------------------------------------------------------
# BLOCK 3 -- bare "tab". Same reasoning as BLOCK 2. Does not collide with
# the existing tab-indent entry (patterns.toml line 251) -- see the BARE
# TAB vs the existing "tab-indent" entry note above.
# -----------------------------------------------------------------------
[[pattern]]
pattern = '''^tab$'''
doc_id = "tab"
whole_utterance_only = true
actions = [
    { function = "press", params = ["tab"] }
]

[[pattern]]
pattern = '''\bnew ?line\b'''
doc_id = "new-line"
actions = [
    { function = "hk", params = ["shift", "enter"] }
]

[[pattern]]
pattern = '''\bnew ?paragraph\b'''
doc_id = "new-paragraph"
actions = [
    { function = "hk", params = ["shift", "enter", 2] }
]

 
