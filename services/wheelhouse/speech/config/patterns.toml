# Voice element clicking (wh-vjwdl). Hotword-required: "click" and "tap" are
# common dictation words, and the capture group is greedy, so every utterance
# that starts with either word would otherwise be parsed as a click command.
# MUST stay AFTER the exact "click to talk mode" entry above so
# first-match-wins lets that specific command win.
# The forward-to-Input execution lands in slice wh-tab7j; this slice only
# parses g1 into an ElementQuery.
#
# The comment above claimed the hotword requirement from the day the entry
# was written, but the entry never set the flag. DeepSeek found it while
# reviewing the Voice Access word "tap", which made the gap reach a second
# common word: "tap water is safe to drink" asked for a control named
# "water is safe to drink". David chose the hotword on 2026-08-17
# (wh-voice-access-parity.1.6.1.1). The cost is that "click the file menu"
# now needs the hotword spoken first.
[[pattern]]
pattern = '''^(?:click|tap)\s+(.+)$'''
doc_id = "click-element"
requires_hotword = true
actions = [
    { function = "click_element", params = ["g1"], awaits_done = true }
]

# Numbered-overlay toggle (wh-n29v.17; renamed and hotword dropped in
# bc91e701). Hotword-free, matching the "click <name>" style. Anchored
# "^show numbers$" / "^hide numbers$" so they do not start with "click"
# and never collide with the broad click pattern above.
# The action delegates to LogicController.handle_overlay_command, which
# applies SHOW_NUMBERS / HIDE_NUMBERS to the overlay state machine and hands
# the returned effects to the integration stub seam (wh-h9a8v2).
#
# The words are "show" and "hide", and only those. David decided on
# 2026-08-17 that Wheelhouse uses the Voice Access wording here, so the
# older "apply numbers" and "dismiss numbers" wordings came back on
# 2026-08-20 as aliases, at David's direction, so a person who learned them
# keeps them (wh-dismiss-alias-restore). "apply" pairs with "show" and
# "dismiss" pairs with "hide", which is the pairing they always had. The
# doc_ids stay "show-numbers" and "hide-numbers": action_catalog.py,
# knowledge/wheelhouse_help.md and the published reference all name those.
[[pattern]]
pattern = '''^(?:show|apply) numbers$'''
doc_id = "show-numbers"
requires_hotword = false
whole_utterance_only = true
actions = [
    { function = "show_overlay_command", awaits_done = true }
]

[[pattern]]
pattern = '''^(?:hide|dismiss) numbers$'''
doc_id = "hide-numbers"
requires_hotword = false
whole_utterance_only = true
actions = [
    { function = "hide_overlay_command", awaits_done = true }
]

# Gesture clicks + mouse grid (wh-grid-speech-routing). All hotword-free,
# matching the "click <name>" / "show numbers" style.
#
# ORDERING NOTES:
# - "right/double click <target>" starts with right/double, never "click",
#   so it cannot collide with "^click to talk mode$" or "^click\s+(.+)$".
# - The bare grid words below use whole_utterance_only so "click", "mark",
#   "drag", "move here" and the bare numbers stay ordinary dictation inside
#   longer utterances (precedent: the mishear punctuation aliases). With the
#   grid CLOSED the actions dictate the captured g1 verbatim, so single-word
#   utterances keep typing normally too.
# - First-word extraction constraint: the catalog indexes command patterns
#   by literal first words, and its extractor only reads a LEADING plain
#   alternation. That is why these use "(right|double)" (not "(?:...)"
#   nested inside the outer capture) and why the digit numbers are an
#   explicit "(1|2|...|9)" alternation.

# "right click recycle bin" / "double click 5" -- full gesture command with
# a target, routed through ClickCommandParser.parse_command so the gesture
# rides the ElementQuery into forward_click_element (by-name, overlay
# number, or grid number alike).
[[pattern]]
pattern = '''^((right|double)[\s-]+click\s+.+)$'''
doc_id = "click-element-gesture"
actions = [
    { function = "click_element_command", params = ["g1"], awaits_done = true }
]

