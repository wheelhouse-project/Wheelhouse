# =============================================================================
# COMMANDS - Scrolling
# =============================================================================
# wh-voice-access-parity.2.3, part one: discrete mouse wheel scrolling. Each
# entry sends whole wheel notches at the pointer's current position; nothing
# here moves or presses the mouse.
#
# All four are whole_utterance_only because "scroll" is an ordinary English
# word. Without the flag the router would execute the command the moment the
# direction word arrived, so "scroll down to the bottom of the page" would
# scroll and then drop the rest of the sentence.
#
# Placement: "scroll" is not the first word of any other command in this file,
# and no other entry matches these phrases, so first-match order does not
# constrain where the section sits. It is placed with the other navigation-like
# commands rather than with the clicking commands, because scrolling presses
# nothing.
#
# wh-voice-access-parity.2.3.3, part two: continuous scrolling. The five
# entries after the discrete four start a scroll that keeps going and stop it
# again. The repeating timer lives in the Input process
# (ui/continuous_scroll.py), so the start command returns at once and the
# single Input command loop stays free for the stop word.
#
# The stop word is "stop scrolling" and NOT a bare "stop". A bare "stop"
# entry would consume the dictated word "stop" in every utterance forever,
# which changes dictation for every user. A bare "stop" is a later addition
# if daily use asks for it, and it would need Logic-side gating that only
# accepts it while a scroll is actually running.

[[pattern]]
pattern = '''^scroll up\s*(\d+)?$'''
doc_id = "scroll-up"
whole_utterance_only = true
actions = [
    { function = "scroll", params = ["up", "g1"] }
]

[[pattern]]
pattern = '''^scroll down\s*(\d+)?$'''
doc_id = "scroll-down"
whole_utterance_only = true
actions = [
    { function = "scroll", params = ["down", "g1"] }
]

[[pattern]]
pattern = '''^scroll left\s*(\d+)?$'''
doc_id = "scroll-left"
whole_utterance_only = true
actions = [
    { function = "scroll", params = ["left", "g1"] }
]

[[pattern]]
pattern = '''^scroll right\s*(\d+)?$'''
doc_id = "scroll-right"
whole_utterance_only = true
actions = [
    { function = "scroll", params = ["right", "g1"] }
]

[[pattern]]
pattern = '''^start scrolling up$'''
doc_id = "scroll-start-up"
whole_utterance_only = true
actions = [
    { function = "start_continuous_scroll", params = ["up"] }
]

[[pattern]]
pattern = '''^start scrolling down$'''
doc_id = "scroll-start-down"
whole_utterance_only = true
actions = [
    { function = "start_continuous_scroll", params = ["down"] }
]

[[pattern]]
pattern = '''^start scrolling left$'''
doc_id = "scroll-start-left"
whole_utterance_only = true
actions = [
    { function = "start_continuous_scroll", params = ["left"] }
]

[[pattern]]
pattern = '''^start scrolling right$'''
doc_id = "scroll-start-right"
whole_utterance_only = true
actions = [
    { function = "start_continuous_scroll", params = ["right"] }
]

[[pattern]]
pattern = '''^stop scrolling$'''
doc_id = "scroll-stop"
whole_utterance_only = true
actions = [
    { function = "stop_continuous_scroll", params = [] }
]


