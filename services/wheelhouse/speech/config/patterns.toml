# =============================================================================
# REPLACEMENTS - Transcription Error Correction
# =============================================================================
# Corrections for words the speech engine mishears in YOUR vocabulary (tool
# names, jargon, places) belong in the writable user patterns file
# (data/user_patterns.toml). Example:
#
# [[pattern]]
# pattern = '''\b(?:cube|coob)ernetes\b'''
# actions = [
#     { function = "text", params = ["Kubernetes"] }
# ]

# Sound-alike punctuation mishears (wh-int8-punctuation-mishears). The shipped
# default STT engine (Parakeet TDT int8) consistently transcribes spoken
# "comma" as come/kama/commer/"come on" and spoken "colon" as colin, which
# breaks dictating those marks out of the box. Verified live 2026-07-16 and
# against a synthetic corpus; hotword boosting cannot fix it (score 2.0
# unchanged, score 4.0 collapses overall accuracy).
#
# Anchored ^...$ AND whole_utterance_only on purpose: the alias fires ONLY
# when the mishear is the entire utterance (how punctuation is dictated
# word-by-word), so "come", "on", and "Colin" remain dictatable inside
# normal sentences. The flag suppresses every early-execute path (immediate
# single-word execute, buffering execute-on-complete, and command-prefix
# splitting), so the pattern fires only at utterance end. Accepted
# trade-off: dictating one of these words as a stand-alone single-word
# utterance now yields punctuation; the escape is "literal come" /
# "literal colin", or overriding the trigger in data/user_patterns.toml.

[[pattern]]
pattern = '''^colin$'''
doc_id = "mishear-colon-colin"
whole_utterance_only = true
actions = [
    { function = "text", params = [":"] }
]

[[pattern]]
pattern = '''^(?:come|kama|commer|come on)$'''
doc_id = "mishear-comma-come"
whole_utterance_only = true
actions = [
    { function = "text", params = [","] }
]

# =============================================================================
# COMMANDS - Voice Access per-app window captures (wh-voice-access-parity.1.7)
# =============================================================================
# The four broad per-app captures. Placed at the very END of the file on
# purpose (corrective move 2026-08-24): each captures everything after its
# trigger word as an app name, so any fixed phrase later in the file that
# starts with the same word would be unreachable. The first placement put
# them above cursor-navigate with their sibling switch-to-app, and
# show-app swallowed "show grid" / "show numbers" (grid section) while
# close-app swallowed the "close parentheses" / "close bracket" /
# "close brace" / "close quotes" / "close single quote" punctuation
# replacements. Last position is the defensive general rule, not just a
# fix for those seven: a broad capture belongs below every fixed phrase
# it could shadow, the same reason cursor-navigate sits below the
# go-to landmark blocks. switch-to-app alone cannot move here -- its
# "go to X" wording must stay ABOVE cursor-navigate's ^go (.+) -- and it
# has no fixed-phrase collisions below its position, so it keeps the
# original spot. requires_hotword = true on all four (free-text capture,
# activate-app shape model).

# "show X" -- kept as its own doc_id rather than merged into switch-to-app.
# Microsoft's own command list groups "show X" with "open X"/"start X"
# ("Open a new app"), not with "switch to X"/"go to X" ("Switch to an
# existing app") -- a different real action (launch vs. focus). The
# fragment's MECHANISM (bead DESCRIPTION) puts "show X" in the per-app
# group using plain activate like the others, which brings an existing
# window to the front rather than launching a new instance. Recorded as a
# fact about the real feature this approximates, not a defect.
[[pattern]]
pattern = '''^show\s+(.+)$'''
doc_id = "show-app"
requires_hotword = true
actions = [
    { function = "activate", params = ["g1"] }
]

# "close X" / "exit X" / "quit X" -- one doc_id, three synonyms of the same
# close action (support.microsoft.com Voice Access command list, fetched
# 2026-08-24, groups all three as alternate phrasings of "Close an open
# app"). The bare phrase "close window" stays owned by the existing
# close-window doc_id in Window Management, far above this block.
[[pattern]]
pattern = '''^(?:close|exit|quit)\s+(.+)$'''
doc_id = "close-app"
requires_hotword = true
actions = [
    { function = "activate", params = ["g1"], awaits_done = true },
    { function = "hk", params = ["alt", "f4"], awaits_done = true }
]

# "minimize X" -- minimize-all-windows (Window Management) precedes this
# block, so "minimize all windows" keeps its own entry.
[[pattern]]
pattern = '''^minimize\s+(.+)$'''
doc_id = "minimize-app"
requires_hotword = true
actions = [
    { function = "activate", params = ["g1"], awaits_done = true },
    { function = "hk", params = ["win", "down"], awaits_done = true }
]

# "maximize X" -- no bulk "maximize all windows" form exists in the bead's
# SCOPE, so this block has no ordering hazard equivalent to minimize-app's.
[[pattern]]
pattern = '''^maximize\s+(.+)$'''
doc_id = "maximize-app"
requires_hotword = true
actions = [
    { function = "activate", params = ["g1"], awaits_done = true },
    { function = "hk", params = ["win", "up"], awaits_done = true }
]
