]

# -----------------------------------------------------------------------
# Touch/on-screen keyboard. Load bearing for help text: say "on-screen
# keyboard", never "touch keyboard". The Windows touch keyboard has no
# stable launch command, and win+ctrl+o toggles the ON-SCREEN keyboard,
# which is a different Windows feature -- help text generated from this
# block must not promise the touch keyboard. That rationale used to be a
# pointer to a "KEYBOARD APPROXIMATION comment above", which does not
# exist in this file: the splice copied the section comments out of
# patterns-staging/wh-voice-access-parity.1.7.toml but not its header
# notes, so the pointer never resolved here. It is inlined above instead;
# the fragment header still holds the long form.
# win+ctrl+o is a toggle, so a "show" or a "hide" phrase
# promises a direction the keystroke cannot deliver -- "hide keyboard"
# opened the keyboard whenever it was already closed. David removed those
# four phrases on 2026-08-27 (wh-keyboard-toggle-only). The four retired
# doc_ids were show-touch-keyboard, show-keyboard, hide-touch-keyboard and
# hide-keyboard; they still appear in
# patterns-staging/wh-voice-access-parity.1.7.toml, which is the record of
# what was spliced and is deliberately not edited.
#
# The command is the single word "keyboard". David's wording, same day:
# "the word 'keyboard' is the toggle command for the keyboard". The block
# below briefly read '^toggle keyboard$' and '^toggle touch keyboard$';
# both are gone, so the older wording reaches no command at all rather
# than a wrong one.
#
# The old ORDERING HAZARD #2 said show-touch-keyboard and show-keyboard
# must both sit above show-app. It does not carry over: show-app is
# '^show\s+(.+)$' and the surviving phrase does not begin with "show".
# None of the 18 capture-all patterns in this file begins with "keyboard"
# -- checked against every '(.+)' capture in the file on 2026-08-27, and
# the bare word first-matched nothing before this block was added -- so
# the block has no ordering constraint against any other block, in either
# direction.
#
# Deliberately has no requires_hotword. The four retired phrases were
# hotword-free too, but they were two words and a two-word show/hide
# instruction almost never collides with dictation. The bare word does:
# "keyboard" is a common dictated noun, and whole_utterance_only does not
# gate on the hotword -- it only delays execution to the end of the
# utterance -- so dictating the word on its own toggles the on-screen
# keyboard. win+ctrl+o is a blind toggle, so an accidental trigger does
# not correct itself. David was shown that consequence and ruled on
# 2026-08-27 to keep the command hotword-free anyway
# (wh-keyboard-toggle-only.1.3), because he chose the bare word as the
# command and requiring the hotword would undo that. Do not add
# requires_hotword back without asking; the hotword-free behavior is the
# design. test_live_keyboard_toggle_is_deliberately_hotword_free in
# tests/test_va_window_app.py pins the flag so an edit cannot flip it
# silently.
# -----------------------------------------------------------------------

[[pattern]]
pattern = '''^keyboard$'''
doc_id = "keyboard-toggle"
whole_utterance_only = true
actions = [
    { function = "hk", params = ["win", "ctrl", "o"] }
]

