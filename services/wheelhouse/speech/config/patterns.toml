]

[[pattern]]
pattern = '''^close window$'''
doc_id = "close-window"
requires_hotword = true
actions = [
    { function = "hk", params = ["alt", "f4"] }
]

# "close tab" -- ORDERING HAZARD #2: this entry must sit above the
# end-of-file close-app capture '''^(?:close|exit|quit)\s+(.+)$'''. That
# capture claimed "close tab" as an application name, and because
# command_engine._execute_rule sends every step without inspecting the
# activate response, the alt+f4 fired against whatever window had focus:
# the user asked to close one tab and lost the whole window (review
# finding wh-voice-access-parity.3.3, David ruling 1 of 2026-08-24).
#
# NO whole_utterance_only, and here is the check behind that. Two
# case-insensitive greps of this file: one for the string "close tab"
# anywhere, which found nothing, and one over every "pattern = " line
# containing "close", which found only close-window, the five punct-close-*
# replacements, and the close-app capture. No entry has a literal body
# starting with "close tab", chained forms included, so this entry cannot
# sever a longer one. Re-run both greps before adding any "close tab ..."
# wording.
#
# requires_hotword mirrors close-window directly above. Without the gate
# the dictated words "close tab" would send Ctrl+W in the middle of
# ordinary typing.
[[pattern]]
pattern = '''^close tab$'''
doc_id = "close-tab"
requires_hotword = true
actions = [
    { function = "hk", params = ["ctrl", "w"] }
]

# The optional verb/noun halves on the next three entries exist because
# the end-of-file per-app captures (show-app, minimize-app, maximize-app)
# otherwise claim the natural phrasings as app names under the hotword:
# "show desktop" became activate("desktop") and the utterance was
# consumed (review finding wh-voice-access-parity.3.3).
[[pattern]]
pattern = '''^(?:show (?:the )?)?desktop$'''
doc_id = "show-desktop"
whole_utterance_only = true
actions = [
    { function = "hk", params = ["win", "d"] }
]

[[pattern]]
pattern = '''^maximize(?: (?:the )?window)?$'''
doc_id = "maximize-window"
whole_utterance_only = true
actions = [
    { function = "hk", params = ["win", "up"] }
]

[[pattern]]
pattern = '''^minimize(?: (?:the )?window)?$'''
doc_id = "minimize-window"
whole_utterance_only = true
actions = [
    { function = "hk", params = ["win", "down"] }
]

[[pattern]]
pattern = '''^Windows? settings$'''
doc_id = "windows-settings"
whole_utterance_only = true
actions = [
    { function = "run", params = ["explorer.exe ms-settings:"] }
]

# --- Voice Access window management, bulk and fixed-phrase forms
# (wh-voice-access-parity.1.7). Placed in this section so they sit ABOVE
# the per-app capture blocks (now at the end of COMMANDS - Cursor
# Navigation): minimize-all-windows must precede minimize-app, and the
# show-* fixed phrases must precede show-app, or the per-app "(.+)"
# captures would claim their tails as app names. The Voice Access
# "go home" wording is deliberately absent: it already means
# press-Home through the cursor-navigate parser, and replacing that
# with show-desktop is an open question for the project owner
# (wh-voice-access-parity.1.7, boss placement note 2026-08-24). ---
# -----------------------------------------------------------------------
# Window management -- bulk and fixed-phrase forms (no capture group,
# no hotword requirement; see the requires_hotword note above).
# -----------------------------------------------------------------------

# "restore window" -- see the crewcut comment above: Win+Down is the
# closest single key, and it is context-sensitive (restore-if-maximized,
# minimize-if-already-restored).
[[pattern]]
pattern = '''^restore window$'''
doc_id = "restore-window"
whole_utterance_only = true
actions = [
    { function = "hk", params = ["win", "down"] }
]

# "show task switcher" -- see the TASK-SWITCHER KEY note above: Win+Tab
# (Task View), not Alt+Tab. ORDERING HAZARD #2: must sit above show-app.
[[pattern]]
pattern = '''^show task switcher$'''
doc_id = "show-task-switcher"
whole_utterance_only = true
actions = [
    { function = "hk", params = ["win", "tab"] }
]

# "list all windows" -- same Win+Tab Task View action as show-task-switcher
# and show-all-windows; see the TASK-SWITCHER KEY note above.
[[pattern]]
pattern = '''^list all windows$'''
doc_id = "list-all-windows"
whole_utterance_only = true
actions = [
    { function = "hk", params = ["win", "tab"] }
]

# "show all windows" -- same Win+Tab Task View action. ORDERING HAZARD #2:
# must sit above show-app (^show\s+(.+)$ would otherwise capture g1="all
# windows").
[[pattern]]
pattern = '''^show all windows$'''
doc_id = "show-all-windows"
whole_utterance_only = true
actions = [
    { function = "hk", params = ["win", "tab"] }
]

# "minimize all windows" -- see the MINIMIZE-ALL KEY note above: Win+M
# specifically (documented verbatim as "Minimize all windows"), not Win+D.
# ORDERING HAZARD #2: must sit above minimize-app (^minimize\s+(.+)$ would
# otherwise capture g1="all windows").
# "windows" is optional ("minimize all" was captured by minimize-app as
# an app named "all" -- wh-voice-access-parity.3.3), which makes the
# short form a PREFIX of the long one, so whole_utterance_only is
# required: without it the router fires win+m at the word "all" and
# dictates "windows".
[[pattern]]
pattern = '''^minimize all(?: windows)?$'''
doc_id = "minimize-all-windows"
whole_utterance_only = true
actions = [
    { function = "hk", params = ["win", "m"] }
]

# -----------------------------------------------------------------------
# Snap window -- four separate patterns, one per direction. hk takes
# literal key names and cannot map a captured direction word to a key
# (bead MECHANISM). See the SNAP KEY COMBINATIONS note above for the
# Win+Left/Right (documented shell keys) vs Win+Alt+Up/Down (documented
# top/bottom-half combination) sourcing.
# -----------------------------------------------------------------------

[[pattern]]
pattern = '''^snap window to the left$'''
doc_id = "snap-window-left"
whole_utterance_only = true
actions = [
    { function = "hk", params = ["win", "left"] }
]

[[pattern]]
pattern = '''^snap window to the right$'''
doc_id = "snap-window-right"
whole_utterance_only = true
