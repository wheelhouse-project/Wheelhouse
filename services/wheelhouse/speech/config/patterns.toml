# --- Voice Access select-by-range forms (wh-voice-access-parity.1.2).
# ORDER MATTERS: every block below must stay ABOVE select-phrase, whose
# ^select (.+)$ capture otherwise swallows every range form (fragment
# ORDERING HAZARD, verified by first-match walk 2026-08-24). ---
# select next <n> characters -- forward, one character at a time.
[[pattern]]
pattern = '''^select next\s+(\d+)?\s*characters?$'''
doc_id = "select-next-characters"
whole_utterance_only = true
actions = [
    { function = "hk", params = ["shift", "right", "g1"] }
]

# select previous/last <n> characters -- backward, one character at a time.
# "last" is a Voice Access synonym for "previous" (see DIRECTION MERGE
# above), not a third direction, so it shares this doc_id and action.
[[pattern]]
pattern = '''^select (?:previous|last)\s+(\d+)?\s*characters?$'''
doc_id = "select-previous-characters"
whole_utterance_only = true
actions = [
    { function = "hk", params = ["shift", "left", "g1"] }
]

# select next <n> words -- forward, by word boundary (shift+ctrl+right is
# the same combination the existing select-word entry uses to extend to a
# word boundary).
[[pattern]]
pattern = '''^select next\s+(\d+)?\s*words?$'''
doc_id = "select-next-words"
whole_utterance_only = true
actions = [
    { function = "hk", params = ["shift", "ctrl", "right", "g1"] }
]

# select previous/last <n> words -- backward, by word boundary.
[[pattern]]
pattern = '''^select (?:previous|last)\s+(\d+)?\s*words?$'''
doc_id = "select-previous-words"
whole_utterance_only = true
actions = [
    { function = "hk", params = ["shift", "ctrl", "left", "g1"] }
]

# select next <n> lines -- forward, one screen line at a time (shift+down,
# per the bead's own MECHANISM example).
[[pattern]]
pattern = '''^select next\s+(\d+)?\s*lines?$'''
doc_id = "select-next-lines"
whole_utterance_only = true
actions = [
    { function = "hk", params = ["shift", "down", "g1"] }
]

# select previous/last <n> lines -- backward, one screen line at a time.
[[pattern]]
pattern = '''^select (?:previous|last)\s+(\d+)?\s*lines?$'''
doc_id = "select-previous-lines"
whole_utterance_only = true
actions = [
    { function = "hk", params = ["shift", "up", "g1"] }
]

# select next <n> paragraphs -- forward, by paragraph jump (shift+ctrl+down,
# the same combination the existing select-paragraph entry's third step
# uses to extend across a paragraph boundary).
[[pattern]]
pattern = '''^select next\s+(\d+)?\s*paragraphs?$'''
doc_id = "select-next-paragraphs"
whole_utterance_only = true
actions = [
    { function = "hk", params = ["shift", "ctrl", "down", "g1"] }
]

# select previous/last <n> paragraphs -- backward, by paragraph jump.
[[pattern]]
pattern = '''^select (?:previous|last)\s+(\d+)?\s*paragraphs?$'''
doc_id = "select-previous-paragraphs"
whole_utterance_only = true
actions = [
    { function = "hk", params = ["shift", "ctrl", "up", "g1"] }
]

# unselect that -- collapse the selection with a single arrow-key press.
# See the KNOWN APPROXIMATION note above: this moves the caret to the
# selection's right edge, unlike Voice Access.
[[pattern]]
pattern = '''^unselect that$'''
doc_id = "unselect-that"
whole_utterance_only = true
actions = [
    { function = "press", params = ["right"] }
]

# clear selection -- same approximation and same single key as unselect
# that, kept as a separate entry/doc_id because it is a separate Voice
# Access wording, not an alias of unselect-that.
[[pattern]]
pattern = '''^clear selection$'''
doc_id = "clear-selection"
whole_utterance_only = true
actions = [
    { function = "press", params = ["right"] }
]

# Select a spoken phrase (wh-spoken-phrase-select). The Input process
# searches the focused text control for the words and selects the first
# match. The match is exact apart from letter case.
#
# ORDER MATTERS. This entry must stay AFTER the four fixed select forms
# above. The catalog walks the file in order and the first match wins, so
# an earlier position here would swallow "select all", "select word",
# "select line", and "select paragraph".
#
# requires_hotword follows the click-element decision of 2026-07-05
# (commit bc91e701). A bare capture after a common English word turns
# every dictated sentence that opens with "select" into a command. The
# same argument settled it for "click <name>", so the same answer applies
# here. Remove this line if daily use shows the hotword costs more than
# the false commands it prevents.
[[pattern]]
pattern = '''^select (.+)$'''
doc_id = "select-phrase"
requires_hotword = true
actions = [
    { function = "select_phrase", params = ["g1"] }
]

# =============================================================================
# COMMANDS - Cursor Navigation
# =============================================================================

# --- Voice Access line and document navigation (wh-voice-access-parity.1.5).
# ORDER MATTERS: all blocks below must stay ABOVE cursor-navigate, whose
# unanchored ^go (.+) otherwise swallows every go-... wording here.
#
# EVERY entry in this fixed nav family carries whole_utterance_only = true
# (review finding wh-voice-access-parity.3.1, same defect class as the
# delete-all precedent). The router executes a complete pattern
# MID-utterance, so without the flag "go to end of line" pressed End at
# the word "end" and typed "of line", and the chain "go to end then grab
# left" was severed the same way. With the flag, these entries fire only
# when the utterance provably ends; a longer buffer falls through to
# cursor-navigate, whose parser resolves chains and rejects ordinary
# sentences into dictation, exactly the pre-branch behavior. Keep the
# flag on any entry added to this family.
# -----------------------------------------------------------------------
# Vertical movement by line and paragraph. "up"/"down" are not directions
# the navigation parser understands (it only knows left/right), so these
# are unreachable today under any verb -- both "go" and "move" fall through
# to dictation. Up = arrow/landmark toward the start of the buffer, down =
# toward the end, matching the existing paragraph mapping in
# speech/navigation/executor.py (_RELATIVE_KEYS: left/paragraph -> ctrl+up,
# right/paragraph -> ctrl+down).
# -----------------------------------------------------------------------

[[pattern]]
pattern = '''^(?:go|move) up(?: (\d+))? lines?$'''
doc_id = "nav-up-lines"
whole_utterance_only = true
actions = [
    { function = "hk", params = ["up", "g1"] }
]

[[pattern]]
pattern = '''^(?:go|move) down(?: (\d+))? lines?$'''
doc_id = "nav-down-lines"
whole_utterance_only = true
actions = [
    { function = "hk", params = ["down", "g1"] }
]

[[pattern]]
pattern = '''^(?:go|move) up(?: (\d+))? paragraphs?$'''
doc_id = "nav-up-paragraphs"
whole_utterance_only = true
actions = [
    { function = "hk", params = ["ctrl", "up", "g1"] }
]

[[pattern]]
pattern = '''^(?:go|move) down(?: (\d+))? paragraphs?$'''
doc_id = "nav-down-paragraphs"
whole_utterance_only = true
actions = [
    { function = "hk", params = ["ctrl", "down", "g1"] }
]

# -----------------------------------------------------------------------
# Horizontal movement by character and word. "go left/right N
# characters/words" already resolves correctly today through cursor-navigate
# (NavigationParser understands left/right + character/word). "move left/
# right N characters/words" does not -- NavigationParser only accepts the
# verbs "go" and "grab", so "move ..." never reaches it and falls through to
# dictation. These blocks cover both verbs identically so they keep working
# the same way once placed above cursor-navigate.
# -----------------------------------------------------------------------

[[pattern]]
pattern = '''^(?:go|move) left(?: (\d+))? characters?$'''
doc_id = "nav-left-characters"
whole_utterance_only = true
actions = [
    { function = "hk", params = ["left", "g1"] }
]

[[pattern]]
pattern = '''^(?:go|move) right(?: (\d+))? characters?$'''
doc_id = "nav-right-characters"
whole_utterance_only = true
actions = [
    { function = "hk", params = ["right", "g1"] }
]

[[pattern]]
pattern = '''^(?:go|move) left(?: (\d+))? words?$'''
doc_id = "nav-left-words"
whole_utterance_only = true
actions = [
    { function = "hk", params = ["ctrl", "left", "g1"] }
]

[[pattern]]
pattern = '''^(?:go|move) right(?: (\d+))? words?$'''
doc_id = "nav-right-words"
whole_utterance_only = true
actions = [
    { function = "hk", params = ["ctrl", "right", "g1"] }
]

# -----------------------------------------------------------------------
# Bare landmarks: "go to top/bottom/end". NavigationParser already parses
# these three today (they are in _SIMPLE_LANDMARKS) and executor.py maps
# them to ctrl+home / ctrl+end / end respectively, so these three already
# move the cursor correctly through cursor-navigate. They are still written
# here as plain hk patterns, matching this bead's MECHANISM for every SCOPE
# form and keeping the whole Voice Access navigation family on one
# consistent authoring path rather than splitting it between the parser and
# plain patterns.
# -----------------------------------------------------------------------

# The optional article on the bare trio, the "go to home" entry, and the
# start-of / top-of / bottom-of forms below exist because switch-to-app
# (hotword-gated, further down) captures any "go to <tail>" wording this
# fixed set misses: "go to the top" activated an app literally named
# "the top" (review finding wh-voice-access-parity.3.2).

# "go to home" -- the pre-existing parser behavior for the "home"
# landmark (speech/navigation/executor.py maps "home" -> the Home key;
# wh-ed4 strips the optional "to"). DISTINCT from the Voice Access
# "go home" command (win+d, David's ruling 2026-08-24, staged fragment
# wh-voice-access-parity.1.7-go-home.toml): only the bare two-word
# "go home" takes the Voice Access meaning; "go to home" keeps moving
# the text cursor.
[[pattern]]
pattern = '''^go to home$'''
doc_id = "nav-go-home"
whole_utterance_only = true
actions = [
    { function = "hk", params = ["home"] }
]

[[pattern]]
pattern = '''^go to (?:the )?top$'''
doc_id = "nav-go-top"
whole_utterance_only = true
actions = [
    { function = "hk", params = ["ctrl", "home"] }
]

[[pattern]]
pattern = '''^go to (?:the )?bottom$'''
doc_id = "nav-go-bottom"
whole_utterance_only = true
actions = [
    { function = "hk", params = ["ctrl", "end"] }
]

# "top/bottom of the document" -- same targets as beginning/end of the
# document under the more casual noun (wh-voice-access-parity.3.2).
[[pattern]]
pattern = '''^go to (?:the )?top of (?:the )?document$'''
doc_id = "nav-go-top-of-document"
whole_utterance_only = true
actions = [
    { function = "hk", params = ["ctrl", "home"] }
]

[[pattern]]
pattern = '''^go to (?:the )?bottom of (?:the )?document$'''
doc_id = "nav-go-bottom-of-document"
whole_utterance_only = true
actions = [
    { function = "hk", params = ["ctrl", "end"] }
]

# -----------------------------------------------------------------------
# "go to the beginning/end of the document/line/word/paragraph". None of
# these resolve correctly today: NavigationParser's compound-landmark path
# only accepts an exact 3-token "prefix of unit" shape (no articles), only
# recognizes "word" and "paragraph" as compound units (never "document" or
# "line"), so the natural phrasing with articles -- "go to the beginning of
# the document" -- matches the cursor-navigate pattern but fails to parse
# and silently does nothing. "the" is optional in both places so "go to
# beginning of the word" and "go to the beginning of word" also match.
# -----------------------------------------------------------------------

[[pattern]]
pattern = '''^go to (?:the )?(?:beginning|start) of (?:the )?document$'''
doc_id = "nav-go-beginning-of-document"
whole_utterance_only = true
actions = [
    { function = "hk", params = ["ctrl", "home"] }
]

[[pattern]]
pattern = '''^go to (?:the )?end of (?:the )?document$'''
doc_id = "nav-go-end-of-document"
whole_utterance_only = true
actions = [
    { function = "hk", params = ["ctrl", "end"] }
]

[[pattern]]
pattern = '''^go to (?:the )?(?:beginning|start) of (?:the )?line$'''
doc_id = "nav-go-beginning-of-line"
whole_utterance_only = true
actions = [
    { function = "hk", params = ["home"] }
]

[[pattern]]
pattern = '''^go to (?:the )?end of (?:the )?line$'''
doc_id = "nav-go-end-of-line"
whole_utterance_only = true
actions = [
    { function = "hk", params = ["end"] }
]

[[pattern]]
pattern = '''^go to (?:the )?(?:beginning|start) of (?:the )?word$'''
doc_id = "nav-go-beginning-of-word"
whole_utterance_only = true
actions = [
    { function = "hk", params = ["ctrl", "left"] }
]

[[pattern]]
pattern = '''^go to (?:the )?end of (?:the )?word$'''
doc_id = "nav-go-end-of-word"
whole_utterance_only = true
actions = [
    { function = "hk", params = ["ctrl", "right"] }
]

[[pattern]]
pattern = '''^go to (?:the )?(?:beginning|start) of (?:the )?paragraph$'''
doc_id = "nav-go-beginning-of-paragraph"
whole_utterance_only = true
actions = [
    { function = "hk", params = ["ctrl", "up"] }
]

[[pattern]]
pattern = '''^go to (?:the )?end of (?:the )?paragraph$'''
doc_id = "nav-go-end-of-paragraph"
whole_utterance_only = true
actions = [
    { function = "hk", params = ["ctrl", "down"] }
]

# Bare "go to end" (end of line, the pre-existing Wheelhouse landmark;
# the official Voice Access command list has no bare "go to end" form).
# Placed BELOW the qualified go-to blocks by boss decision 2026-08-24.
# An earlier version of this comment claimed both-ends anchoring alone
# made the order defensive; that was wrong (wh-voice-access-parity.3.1):
# the router executes complete patterns mid-utterance, so before the
# whole_utterance_only flag this bare form fired at word three of every
# "go to end of ..." phrase. The flag plus this order is what keeps the
# qualified wordings reachable.
[[pattern]]
pattern = '''^go to (?:the )?end$'''
doc_id = "nav-go-end"
whole_utterance_only = true
actions = [
    { function = "hk", params = ["end"] }
]

# -----------------------------------------------------------------------
# "move to the beginning/end of the selection". Collapses the current
# selection without extending it: an unshifted left-arrow press collapses
# to the selection's start, an unshifted right-arrow press collapses to its
# end (standard Windows text-control behavior). Neither NavigationParser nor
# the existing cursor-navigate entry has any concept of "selection" as a
# landmark, and the verb is "move" (not "go" or "grab"), so this never
# reaches the parser today and falls through to dictation.
# -----------------------------------------------------------------------

[[pattern]]
pattern = '''^move to (?:the )?beginning of (?:the )?selection$'''
doc_id = "nav-move-beginning-of-selection"
whole_utterance_only = true
actions = [
    { function = "hk", params = ["left"] }
]

[[pattern]]
pattern = '''^move to (?:the )?end of (?:the )?selection$'''
doc_id = "nav-move-end-of-selection"
whole_utterance_only = true
actions = [
    { function = "hk", params = ["right"] }
]

# --- Voice Access per-app window commands (wh-voice-access-parity.1.7).
# Placement is load bearing in BOTH directions. ONLY switch-to-app lives
# here: it must sit BELOW every specific "go to <landmark>" block above
# (its go-to half would otherwise capture "top"/"bottom"/"end" as app
# names) and ABOVE cursor-navigate, whose unanchored ^go (.+) would
# otherwise swallow the "go to <app>" wording. The fragment's other four
# per-app captures (show-app, close-app, minimize-app, maximize-app) have
# no "go" wording and no reason to sit this early; the first placement
# put all five here and show-app swallowed "show grid"/"show numbers"
# (grid section) while close-app swallowed the "close parentheses"/
# "close bracket"/"close brace"/"close quotes"/"close single quote"
# punctuation replacements, all of which sit later in this file. Those
# four broad captures now live at the very END of the file -- see the
# per-app tail section there (corrective move 2026-08-24). ---
# -----------------------------------------------------------------------
# requires_hotword = true on every per-app block (see the requires_hotword
# note above -- matches the activate-app shape model).
# -----------------------------------------------------------------------

# "switch to X" / "go to X" -- one doc_id, two accepted wordings for the
# same activate action (support.microsoft.com Voice Access command list,
# fetched 2026-08-24, groups them as alternate phrasings of one command;
# same DIRECTION-MERGE-style reasoning as wh-voice-access-parity.1.2's
# previous/last merge). ORDERING HAZARD #1 still applies to this block's
# go-to half: every fixed "go to <landmark>" entry must precede it.
# ORDERING HAZARD #2 NO LONGER NAMES go-to-desktop. David eliminated that
# entry on 2026-08-24 (wh-voice-access-parity.3.3) because "go home" is
# now the one show-desktop command. The accepted consequence is that
# "go to desktop" reaches this capture and asks for a window named
# "desktop"; the guard is TestGoToDesktopIsEliminated in
# services/wheelhouse/tests/test_va_navigation_router.py. The staged
# "go home" block (wh-voice-access-parity.1.7) must be placed ABOVE this
# capture when it is spliced.
[[pattern]]
pattern = '''^(?:switch to|go to)\s+(.+)$'''
doc_id = "switch-to-app"
requires_hotword = true
actions = [
    { function = "activate", params = ["g1"] }
]

# Composable cursor movement: "go right two words", "go home", etc.
# Chaining: "go home then grab to end" (multiple commands in one utterance)
# Invalid input falls through to dictation (inserted as text)
[[pattern]]
pattern = '''^go (.+)'''
doc_id = "cursor-navigate"
actions = [{ function = "cursor_navigate", params = ["go g1"] }]


